[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "explainer"
version = "0.1.0"
description = "Whiteboard-style explainer videos: Manim scenes, edge-tts narration, ffmpeg merge."
requires-python = ">=3.11"
dependencies = ["manim", "edge-tts>=7.2", "shapely>=2.0", "pillow"]

[tool.setuptools]
packages = ["explainer", "explainer.qa", "explainer.symbols"]

[tool.setuptools.package-data]
explainer = ["assets/tabler/LICENSE", "assets/tabler/outline/*.svg"]
