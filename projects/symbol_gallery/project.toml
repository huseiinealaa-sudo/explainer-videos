# symbol_gallery is a silent catalogue: NARRATION in the script holds segment durations
# (seconds), so no voice is used. The keys stay for the pipeline's defaults.
[narration]
language = "en"
voice = "en-US-GuyNeural"
rate = "+0%"

# Colours: pinned to the original white board so this project renders exactly as it was published.
[style]
theme = "light"
